<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-label="Environment and installation consent">
<title>Environment and installation consent</title>
<rect width="1040" height="480" rx="18" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<text x="40" y="47" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="650" fill="#0f172a">
<tspan x="40" dy="0">01  Environment and installation consent</tspan>
</text>
<rect x="40" y="110" width="240" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="160.0" y="148.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="500" fill="#0f172a">
<tspan x="160.0" dy="0">Check existing software</tspan>
<tspan x="160.0" dy="27">Blender · Python</tspan>
</text>
<polygon points="450,91 566,155 450,219 334,155" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="450" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="500" fill="#0f172a">
<tspan x="450" dy="0">Required tools</tspan>
<tspan x="450" dy="27">available?</tspan>
</text>
<rect x="680" y="110" width="320" height="90" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text x="840.0" y="148.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="500" fill="#0f172a">
<tspan x="840.0" dy="0">Confirm Blender MCP</tspan>
<tspan x="840.0" dy="27">Continue scene production</tspan>
</text>
<path d="M 280 155 H 333" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 566 155 H 679" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="621" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="500" fill="#475569">
<tspan x="621" dy="0">Yes</tspan>
</text>
<rect x="310" y="294" width="280" height="92" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="450.0" y="333.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="500" fill="#0f172a">
<tspan x="450.0" dy="0">Explain missing dependencies</tspan>
<tspan x="450.0" dy="27">Ask permission to install</tspan>
</text>
<path d="M 450 219 V 293" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="470" y="264" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="500" fill="#475569">
<tspan x="470" dy="0">No</tspan>
</text>
<rect x="680" y="294" width="320" height="92" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="840.0" y="333.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="500" fill="#0f172a">
<tspan x="840.0" dy="0">Install approved dependencies</tspan>
<tspan x="840.0" dy="27">Recheck the environment</tspan>
</text>
<path d="M 590 340 H 679" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="635" y="327" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#475569">
<tspan x="635" dy="0">Approved</tspan>
</text>
<path d="M 840 294 V 201" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="445" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" fill="#475569">
<tspan x="40" dy="0">If installation is deferred or declined, keep the analysis and manifest and await dependencies.</tspan>
</text>
</svg>
